%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/light/ams,tcs3430.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ams OSRAM TCS3430 XYZ Tristimulus Color and Ambient Light Sensor

maintainers:
  - robertijtsma <37256770+robertijtsma@users.noreply.github.com>

description: |
  The ams OSRAM TCS3430 is an I2C ambient light and CIE 1931 XYZ tristimulus
  color sensor with photopic Y, Z, X, and IR1 channels.

properties:
  compatible:
    const: ams,tcs3430

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        light-sensor@39 {
            compatible = "ams,tcs3430";
            reg = <0x39>;
            interrupts = <24 IRQ_TYPE_LEVEL_LOW>;
        };
    };
...
